<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Producción Electrónica</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            line-height: 1.6;
            padding: 20px;
        }

        header {
            text-align: center;
            background-color: #1e293b;
            padding: 30px 20px;
            border-radius: 12px;
            margin-bottom: 30px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
        }

        header h1 {
            font-size: 2.2rem;
            color: #38bdf8;
            margin-bottom: 8px;
        }

        header p {
            color: #94a3b8;
            font-size: 1.1rem;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
        }

        .galeria {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 25px;
        }

        .tarjeta {
            background: #1e293b;
            border-radius: 10px;
            padding: 20px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.2);
            border: 1px solid #334155;
            text-align: center;
        }

        .tarjeta h3 {
            margin-top: 15px;
            color: #f1f5f9;
            font-size: 1.2rem;
        }

        .tarjeta img {
            width: 100%;
            height: 220px;
            object-fit: cover;
            border-radius: 8px;
            border: 1px solid #475569;
        }

        footer {
            text-align: center;
            margin-top: 40px;
            padding: 20px;
            font-size: 0.9rem;
            color: #64748b;
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>Producción Electrónica</h1>
            <p>Documentación de diagramas, esquemáticos y diseño de PCBs</p>
        </header>

        <main class="galeria">

            <div class="tarjeta">
                <img src="esquematico.png" alt="Esquemático">
                <h3>Esquemático</h3>
            </div>

            <div class="tarjeta">
                <img src="editor-placas.png" alt="Editor de Placas">
                <h3>Editor de Placas</h3>
            </div>

            <div class="tarjeta">
                <img src="footprint-libraries.png" alt="Librerías de Footprint">
                <h3>Librerías de Footprint</h3>
            </div>

            <div class="tarjeta">
                <img src="drc.png" alt="Control de Reglas (DRC)">
                <h3>Control de Reglas (DRC)</h3>
            </div>

            <div class="tarjeta">
                <img src="drc - copia.png" alt="DRC Verificación">
                <h3>DRC Verificación</h3>
            </div>

            <div class="tarjeta">
                <img src="separacion-pistas.png" alt="Separación de Pistas">
                <h3>Separación de Pistas</h3>
            </div>

            <div class="tarjeta">
                <img src="gerber-svg-export.png" alt="Exportación Gerber/SVG">
                <h3>Exportación Gerber/SVG</h3>
            </div>

            <div class="tarjeta">
                <img src="mods-pistas.png" alt="MODS - Pistas">
                <h3>MODS - Pistas</h3>
            </div>

            <div class="tarjeta">
                <img src="mods-contorno.png" alt="MODS - Contorno">
                <h3>MODS - Contorno</h3>
            </div>

        </main>

        <footer>
            <p>&copy; 2026 Producción Electrónica</p>
        </footer>
    </div>

</body>
</html>
