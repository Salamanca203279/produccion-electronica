<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Producción Electrónica</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            color: #333;
            line-height: 1.6;
            padding: 20px;
        }

        header {
            text-align: center;
            background-color: #1e293b;
            color: #ffffff;
            padding: 30px 20px;
            border-radius: 8px;
            margin-bottom: 30px;
        }

        header h1 {
            font-size: 2.2rem;
            margin-bottom: 10px;
        }

        header p {
            color: #cbd5e1;
            font-size: 1.1rem;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        .galeria {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }

        .tarjeta {
            background: #ffffff;
            border-radius: 8px;
            padding: 15px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            text-align: center;
        }

        .tarjeta img {
            width: 100%;
            height: 200px;
            object-fit: cover;
            border-radius: 6px;
            margin-bottom: 12px;
        }

        .tarjeta h3 {
            margin-bottom: 8px;
            color: #0f172a;
        }

        .tarjeta p {
            font-size: 0.95rem;
            color: #64748b;
        }

        footer {
            text-align: center;
            margin-top: 40px;
            padding: 20px;
            font-size: 0.9rem;
            color: #64748b;
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>Producción Electrónica</h1>
            <p>Documentación de circuitos, prototipos y proyectos</p>
        </header>

        <main class="galeria">
            <!-- Tarjeta 1 -->
            <div class="tarjeta">
                <!-- REEMPLAZA 'foto1.jpg' por el nombre EXACTO de la imagen en tu GitHub -->
                <img src="foto1.jpg" alt="Proyecto 1">
                <h3>Diseño de Circuito</h3>
                <p>Prototipo creado en la sesión de práctica.</p>
            </div>

            <!-- Tarjeta 2 -->
            <div class="tarjeta">
                <!-- REEMPLAZA 'foto2.jpg' por el nombre EXACTO de la imagen en tu GitHub -->
                <img src="foto2.jpg" alt="Proyecto 2">
                <h3>Placa PCB</h3>
                <p>Resultado del grabado y soldado de componentes.</p>
            </div>
        </main>

        <footer>
            <p>&copy; 2026 Producción Electrónica - Todos los derechos reservados</p>
        </footer>
    </div>

</body>
</html>
